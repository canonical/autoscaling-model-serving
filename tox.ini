[tox]
skipsdist = True
skip_missing_interpreters = True
env_list = fmt, lint, integration-{standard,knative}

[testenv]
deps =
	poetry>=2.1.3

[vars]
terraform_path = {toxinidir}/terraform
tst_path = {toxinidir}/tests

[testenv:update-requirements]
description = Update and upgrade dependencies
commands =
    poetry lock --regenerate
commands_pre =
    poetry install --only update-requirements
skip_install = true

[testenv:fmt]
description = Apply coding style standards to code
commands_pre =
    poetry install --only fmt
commands =
    isort {[vars]tst_path}
    black {[vars]tst_path}
skip_install = true

[testenv:lint]
description = Check code against coding style standards
commands =
    codespell {toxinidir}/. --skip {toxinidir}/./.git --skip {toxinidir}/./.tox \
      --skip {toxinidir}/./build --skip {toxinidir}/./lib --skip {toxinidir}/./venv \
      --skip {toxinidir}/./.mypy_cache \
      --skip {toxinidir}/./icon.svg --skip *.json.tmpl \
      --skip {toxinidir}/./poetry.lock
    ruff check {[vars]tst_path}
    ruff format --check --diff {[vars]tst_path}
    black --check {[vars]tst_path}
    pyright {posargs}
commands_pre =
    poetry install --only lint
skip_install = true

[testenv:integration-standard]
description = Run integration tests with KServe in Standard mode
commands =
    pytest -vv --tb native --log-cli-level=INFO --color=yes -s {posargs} {[vars]tst_path}/integration/integration-standard.py
commands_pre =
    poetry install --only integration
skip_install = true

[testenv:integration-knative]
description = Run integration tests with KServe in Knative mode
allowlist_externals =
	cd
commands =
    cd {[vars]terraform_path}
    pytest -vv --tb native --log-cli-level=INFO --color=yes -s {posargs} {[vars]tst_path}/integration/integration-knative.py
commands_pre =
    poetry install --only integration
skip_install = true
